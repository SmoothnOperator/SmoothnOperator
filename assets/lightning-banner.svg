<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Electric Lightning Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Lightning Bolts -->
    <linearGradient id="boltGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="boltGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    /* Flash Background when lightning strikes */
    @keyframes skyFlash {
      0%, 44%, 48%, 52%, 88%, 92%, 96%, 100% { fill-opacity: 0; }
      45%, 47% { fill-opacity: 0.15; fill: #38bdf8; }
      49%, 51% { fill-opacity: 0.25; fill: #818cf8; }
      89%, 91% { fill-opacity: 0.2; fill: #a855f7; }
      93%, 95% { fill-opacity: 0.35; fill: #ffffff; }
    }

    /* Primary Lightning Strike (Right) */
    @keyframes lightningStrike1 {
      0%, 88%, 97%, 100% { opacity: 0; stroke-width: 1; }
      89% { opacity: 0.9; stroke-width: 3.5; }
      90% { opacity: 0.3; stroke-width: 2; }
      91% { opacity: 1; stroke-width: 4; }
      93% { opacity: 0.8; stroke-width: 2.5; }
      95% { opacity: 1; stroke-width: 3.5; }
      96% { opacity: 0.2; stroke-width: 1; }
    }

    /* Secondary Lightning Strike (Left) */
    @keyframes lightningStrike2 {
      0%, 44%, 53%, 100% { opacity: 0; stroke-width: 1; }
      45% { opacity: 0.85; stroke-width: 3; }
      47% { opacity: 0.2; stroke-width: 1.5; }
      48% { opacity: 1; stroke-width: 3.8; }
      50% { opacity: 0.7; stroke-width: 2; }
      51% { opacity: 1; stroke-width: 3.2; }
      52% { opacity: 0.2; stroke-width: 1; }
    }

    /* Central Ambient Lightning Discharge */
    @keyframes centerDischarge {
      0%, 19%, 25%, 69%, 75%, 100% { opacity: 0; }
      20%, 24% { opacity: 0.7; stroke-width: 2; }
      21%, 23% { opacity: 1; stroke-width: 2.8; }
      70%, 74% { opacity: 0.6; stroke-width: 1.8; }
      71%, 73% { opacity: 0.9; stroke-width: 2.5; }
    }

    /* Floating Electric Plasma Sparks */
    @keyframes pulseSpark {
      0%, 100% { opacity: 0.2; transform: translateY(0px) scale(0.9); }
      50% { opacity: 0.9; transform: translateY(-6px) scale(1.2); }
    }

    /* Glowing Text Pulse */
    @keyframes neonText {
      0%, 100% { text-shadow: 0 0 10px #38bdf8, 0 0 20px #38bdf8, 0 0 40px #818cf8; }
      45%, 49%, 91%, 95% { text-shadow: 0 0 18px #ffffff, 0 0 35px #38bdf8, 0 0 60px #c084fc; }
    }

    .strike-1 { animation: lightningStrike1 5s infinite; }
    .strike-2 { animation: lightningStrike2 5s infinite; }
    .strike-center { animation: centerDischarge 6s infinite; }
    .sky-flash { animation: skyFlash 5s infinite; }
    .spark { animation: pulseSpark 2.5s ease-in-out infinite; }
    .title-glow { animation: neonText 5s infinite; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="900" height="220" rx="16" fill="url(#bg)" />
  <rect width="900" height="220" rx="16" fill="url(#grid)" />

  <!-- Animated Lightning Flash Overlay -->
  <rect class="sky-flash" width="900" height="220" rx="16" fill="#38bdf8" />

  <!-- Left Lightning Strike System -->
  <g class="strike-2" filter="url(#glow-cyan)">
    <!-- Main Left Trunk -->
    <path d="M 120 0 L 150 45 L 130 80 L 175 125 L 155 155 L 210 220" 
          stroke="url(#boltGrad1)" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Branch 1 -->
    <path d="M 150 45 L 195 65 L 220 95" 
          stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round" />
    <!-- Left Branch 2 -->
    <path d="M 175 125 L 140 160 L 145 190" 
          stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" />
    <!-- Fork Sub-branch -->
    <path d="M 195 65 L 230 75" 
          stroke="#7dd3fc" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Right Lightning Strike System -->
  <g class="strike-1" filter="url(#glow-purple)">
    <!-- Main Right Trunk -->
    <path d="M 780 0 L 740 40 L 765 75 L 715 130 L 745 165 L 690 220" 
          stroke="url(#boltGrad2)" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Branch 1 -->
    <path d="M 740 40 L 690 55 L 670 90" 
          stroke="#f3e8ff" stroke-width="2" stroke-linecap="round" />
    <!-- Right Branch 2 -->
    <path d="M 715 130 L 755 155 L 750 195" 
          stroke="#e9d5ff" stroke-width="1.6" stroke-linecap="round" />
    <!-- Fork Sub-branch -->
    <path d="M 690 55 L 660 60" 
          stroke="#d8b4fe" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Center Sudden Arc -->
  <g class="strike-center" filter="url(#glow-cyan)">
    <path d="M 450 0 L 440 30 L 465 55 L 435 85 L 455 105" 
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 465 55 L 490 70" 
          stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Electric Plasma Sparks Floating -->
  <circle class="spark" cx="140" cy="90" r="3" fill="#38bdf8" filter="url(#glow-cyan)" />
  <circle class="spark" cx="220" cy="160" r="2.5" fill="#a855f7" filter="url(#glow-purple)" style="animation-delay: 0.8s;" />
  <circle class="spark" cx="720" cy="70" r="3" fill="#818cf8" filter="url(#glow-cyan)" style="animation-delay: 1.4s;" />
  <circle class="spark" cx="680" cy="150" r="2.5" fill="#c084fc" filter="url(#glow-purple)" style="animation-delay: 0.4s;" />
  <circle class="spark" cx="450" cy="40" r="2" fill="#ffffff" filter="url(#glow-cyan)" style="animation-delay: 1.9s;" />

  <!-- Center Decorative Cyber Rings -->
  <circle cx="450" cy="110" r="75" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 8" stroke-opacity="0.6"/>
  <circle cx="450" cy="110" r="60" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="8 6" stroke-opacity="0.3"/>

  <!-- Glowing Header Typography -->
  <text class="title-glow" x="450" y="105" text-anchor="middle" 
        fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Fira Code', monospace" 
        font-size="36" font-weight="800" letter-spacing="3.5">
    NIKHIL KUMAR
  </text>

  <!-- Subtitle Tag -->
  <text x="450" y="140" text-anchor="middle" 
        fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Fira Code', monospace" 
        font-size="14" font-weight="600" letter-spacing="2.5">
    ⚡ BLOCKCHAIN DEVELOPER &amp; DISTRIBUTED SYSTEMS ⚡
  </text>

  <!-- Electric Bottom Border Accent Line -->
  <line x1="50" y1="218" x2="850" y2="218" stroke="url(#boltGrad1)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="250" y1="218" x2="650" y2="218" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-cyan)"/>
</svg>
