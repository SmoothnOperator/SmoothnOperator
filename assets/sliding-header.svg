<svg xmlns="http://www.w3.org/2000/svg" width="700" height="65" viewBox="0 0 700 65" fill="none">
  <defs>
    <!-- Vibrant Gradient for Text Glow -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Smooth Slide-In from Left + Continuous Gentle Float Transition */
    @keyframes slideInAndFloat {
      0% {
        transform: translateX(-80px);
        opacity: 0;
      }
      20% {
        transform: translateX(0px);
        opacity: 1;
      }
      50% {
        transform: translateX(10px);
        opacity: 1;
      }
      80% {
        transform: translateX(-4px);
        opacity: 1;
      }
      100% {
        transform: translateX(0px);
        opacity: 1;
      }
    }

    /* Ambient Floating Glow Keyframe */
    @keyframes subtleGlow {
      0%, 100% {
        filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4));
      }
      50% {
        filter: drop-shadow(0 0 16px rgba(192, 132, 252, 0.6)) drop-shadow(0 0 4px rgba(56, 189, 248, 0.8));
      }
    }

    .slide-group {
      animation: slideInAndFloat 4s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 subtleGlow 4s ease-in-out infinite 4s;
    }
  </style>

  <!-- Sliding Header Content Group -->
  <g class="slide-group">
    <!-- Main Title with Developer Emoji -->
    <text x="350" y="44" text-anchor="middle"
          fill="url(#headerGrad)"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="34"
          font-weight="800"
          letter-spacing="0.5">
      Hi, I'm Nikhil Kumar 👨‍💻
    </text>
  </g>
</svg>
