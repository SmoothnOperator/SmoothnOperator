<svg xmlns="http://www.w3.org/2000/svg" width="480" height="92" viewBox="0 0 480 92" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
    <linearGradient id="spotifyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#1ed760" />
    </linearGradient>
  </defs>

  <style>
    @keyframes bar1 { 0%, 100% { height: 6px; y: 48px; } 50% { height: 26px; y: 28px; } }
    @keyframes bar2 { 0%, 100% { height: 24px; y: 30px; } 50% { height: 8px; y: 46px; } }
    @keyframes bar3 { 0%, 100% { height: 12px; y: 42px; } 50% { height: 32px; y: 22px; } }
    @keyframes bar4 { 0%, 100% { height: 30px; y: 24px; } 50% { height: 10px; y: 44px; } }
    @keyframes bar5 { 0%, 100% { height: 16px; y: 38px; } 50% { height: 28px; y: 26px; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .bar-1 { animation: bar1 1.1s ease-in-out infinite; }
    .bar-2 { animation: bar2 0.8s ease-in-out infinite; }
    .bar-3 { animation: bar3 1.3s ease-in-out infinite; }
    .bar-4 { animation: bar4 0.9s ease-in-out infinite; }
    .bar-5 { animation: bar5 1.2s ease-in-out infinite; }
    .album-art { transform-origin: 46px 46px; animation: spin 8s linear infinite; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="478" height="90" rx="14" fill="url(#bg)" stroke="#30363D" stroke-width="1.5"/>

  <!-- Rotating Vinyl / Album -->
  <g class="album-art">
    <circle cx="46" cy="46" r="26" fill="#1C2128" stroke="#1DB954" stroke-width="2"/>
    <circle cx="46" cy="46" r="18" fill="#0D1117"/>
    <circle cx="46" cy="46" r="10" fill="#1DB954"/>
    <circle cx="46" cy="46" r="3" fill="#0D1117"/>
  </g>

  <!-- Header Label with Spotify Logo -->
  <text x="96" y="32" fill="#1DB954" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">LISTENING TO SPOTIFY</text>

  <!-- Track Title -->
  <text x="96" y="53" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Lofi Coding Beats · Chill Synthwave</text>

  <!-- Artist / Subtext -->
  <text x="96" y="71" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Smooth Radio · Focus Beats</text>

  <!-- Animated Sound Equalizer Bars -->
  <g transform="translate(415, 8)">
    <rect class="bar-1" x="0" y="48" width="4" height="6" rx="2" fill="url(#spotifyGreen)"/>
    <rect class="bar-2" x="8" y="30" width="4" height="24" rx="2" fill="url(#spotifyGreen)"/>
    <rect class="bar-3" x="16" y="42" width="4" height="12" rx="2" fill="url(#spotifyGreen)"/>
    <rect class="bar-4" x="24" y="24" width="4" height="30" rx="2" fill="url(#spotifyGreen)"/>
    <rect class="bar-5" x="32" y="38" width="4" height="16" rx="2" fill="url(#spotifyGreen)"/>
  </g>
</svg>
